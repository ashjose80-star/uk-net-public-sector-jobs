<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:#172033;color:#fff;padding:20px 16px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:21px}header p{margin:4px 0 0;color:#cbd5e1;font-size:12px}main{max-width:1200px;margin:auto;padding:12px 12px 72px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.kpi{background:#fff;border:1px solid #dbe2ea;border-radius:13px;padding:11px}.num{font-size:22px;font-weight:800}.muted{font-size:11px;color:#64748b}.search-form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:9px;background:#fff;border:1px solid #dbe2ea;border-radius:14px;padding:12px;margin-bottom:10px;align-items:end}

.clear-btn:hover{background:#eef2f7}input,select{min-height:42px;border:1px solid #dbe2ea;border-radius:9px;padding:8px 10px;font-size:14px;background:#fff;color:#172033}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:9px}.tabs button{border:1px solid #dbe2ea;background:#fff;border-radius:9px;padding:9px 12px;white-space:nowrap}.tabs button.active{background:#172033;color:#fff}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.job,.coverage{background:#fff;border:1px solid #dbe2ea;border-radius:13px;padding:13px}.job h3{margin:0 0 3px;font-size:16px}.org{font-weight:700}.meta{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.pill{font-size:10px;padding:4px 7px;border-radius:999px;background:#eef2f7}.exact{background:#dcfce7;color:#166534}.related{background:#fef3c7;color:#854d0e}.confidence{font-size:11px;color:#64748b;margin:7px 0}.result-summary{font-size:12px;color:#64748b;margin:6px 2px 8px}.update-strip{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#eef6ff;border:1px solid #cfe3ff;border-radius:10px;padding:8px 10px;margin:0 0 8px;font-size:11px;color:#334155}.update-strip button{border:1px solid #b8cbe3;background:#fff;border-radius:8px;padding:6px 9px;cursor:pointer}.tech{font-size:12px;line-height:1.45;color:#334155}.apply{display:inline-block;margin-top:8px;padding:8px 11px;border-radius:8px;background:#2563eb;color:white;text-decoration:none;font-size:12px}.coverage-row{margin-bottom:9px}.coverage-row b{display:block}.bar{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:6px}.bar span{display:block;height:100%;background:#64748b}@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.search-form{grid-template-columns:1fr 1fr}.search-field{grid-column:1/-1}.clear-btn{width:100%}.list{grid-template-columns:1fr}}@media(max-width:430px){.search-form{grid-template-columns:1fr}.search-field{grid-column:auto}.kpi{padding:9px}.num{font-size:20px}}
</style></head><body><header><h1>UK .NET Public Sector Jobs</h1><p>Mobile-first • Councils + HE providers • active, leads, history and coverage</p></header><main><div id="kpis" class="kpis"></div><form class="search-form" id="searchForm" onsubmit="return false">
      <div class="field search-field">

<script>let D={"active": [{"org":"University of Essex","sector":"University","location":"Colchester / Essex","title":"Senior Software Engineer","salary":"Not captured","posted":"2026-07","closing":"","match":"Exact .NET","tech":"C#; .NET Core; AWS; Terraform/CDK; CI/CD; Docker; Kubernetes; relational/NoSQL","url":"https://www.jobs.ac.uk/job/DSH846/senior-software-engineer","confidence":"Verified vacancy; jobs.ac.uk listing"},{"org":"DWP Digital","sector":"Government","location":"Newcastle upon Tyne","title":"Data Engineer Level I","salary":"£38,772","posted":"2026-08-19","closing":"2026-09-02","match":"Exact .NET ecosystem","tech":".NET 4.8; C#; JavaScript; C++; Java; SQL; PySpark; AWS; ETL","url":"https://www.jobs.service.gov.uk/jobs/6a85efb1123dc116db91a7e1","confidence":"Verified government vacancy; closing date has passed"},{"org": "Liverpool City Council", "sector": "Council", "location": "Liverpool", "title": "Web Developer", "salary": "Not captured", "posted": "2026-06-18", "closing": "", "match": "Exact .NET", "tech": ".NET; Umbraco; C#; HTML5; SQL Server", "url": "https://jobs.liverpool.gov.uk/jobs/job/Web-Developer/1908", "confidence": "Verified employer vacancy"}, {"org": "Oxfordshire County Council", "sector": "Council", "location": "Oxford", "title": "Software Developer", "salary": "\u00a351,928\u2013\u00a355,225", "posted": "2026-09-17", "closing": "2026-10-16", "match": "Related", "tech": "Microsoft; Azure; APIs; Power Platform; .NET not explicit", "url": "https://www.jobs.service.gov.uk/jobs/6aabc38c46fdd8defc2e367c", "confidence": "Verified vacancy; .NET not explicit"}, {"org": "Richmond and Wandsworth Councils", "sector": "Council", "location": "London", "title": "Digital Development Manager", "salary": "Not captured", "posted": "2026-08-30", "closing": "", "match": "Exact .NET", "tech": "ASP.NET; .NET Core; REST APIs", "url": "https://jobs.richmondandwandsworth.gov.uk/jobs/job/Digital-Development-Manager/9476", "confidence": "Verified employer vacancy"}, {"org": "Tameside Metropolitan Borough Council", "sector": "Council", "location": "Tameside / Greater Manchester", "title": "Senior Web Developer", "salary": "\u00a346,142\u2013\u00a348,226", "posted": "2026-09", "closing": "", "match": "Exact .NET", "tech": "ASP.NET; C#; React; Next.js; MongoDB; GitHub; AI tooling", "url": "https://www.simplyhired.co.uk/job/eIIjj6r655KEpaHEcQNA6SqnwUQFalRZdlkB4_jeR-U1i5yO6iqrAw", "confidence": "Current search result; verify employer page"}, {"org": "University of Glasgow", "sector": "University", "location": "Glasgow", "title": "Research Software Engineer", "salary": "Not captured", "posted": "2026-09-09", "closing": "2026-10-07", "match": "Related", "tech": "C/C++; Python; AI; HPC; .NET not explicit", "url": "https://www.jobs.gla.ac.uk/job/research-software-engineer-6022416", "confidence": "Verified employer vacancy"}, {"org": "Queen's University Belfast", "sector": "University", "location": "Belfast", "title": "Project Lead for NICPLD Digital Infrastructure", "salary": "Not captured", "posted": "2026-07", "closing": "", "match": "Exact .NET", "tech": "C#.NET; Java; PHP; React/Vue/Angular", "url": "https://hrwebapp.qub.ac.uk/tlive_webrecruitment/wrd/run/ETREC107GF.open?LANG=USA&VACANCY_ID=152721WjCP&WVID=6273090Lgx", "confidence": "Verified university vacancy"}], "leads": [{"org": "Coventry University", "sector": "University", "location": "Coventry", "title": "C# Developer", "salary": "\u00a345,000\u2013\u00a355,000", "posted": "2026-09", "closing": "", "match": "Exact .NET", "tech": "C#; .NET; SQL Server; REST APIs; SOLID", "url": "https://www.coventry.ac.uk/", "confidence": "AI/search lead; employer vacancy needs verification"}, {"org": "Cardiff University", "sector": "University", "location": "Cardiff", "title": "Software/IT vacancy watch", "salary": "Varies", "posted": "", "closing": "", "match": "Watchlist", "tech": "University vacancy portal; monitor C#/.NET/ASP.NET roles", "url": "https://www.cardiff.ac.uk/jobs/vacancies", "confidence": "Organisation watchlist, not a specific vacancy"}], "history": [{"org": "Liverpool City Council", "sector": "Council", "title": "Developer", "date": "2025-09-29", "match": "Exact .NET", "tech": ".NET; Umbraco; C#; SharePoint/M365"}, {"org": "Liverpool City Council", "sector": "Council", "title": "Process Developer", "date": "2025-12-04", "match": "Exact .NET", "tech": ".NET; Umbraco; C#; SharePoint/M365"}, {"org": "Liverpool City Council", "sector": "Council", "title": "Web Developer", "date": "2026-03-12", "match": "Exact .NET", "tech": ".NET; Umbraco; C#; SharePoint/M365"}, {"org": "Liverpool City Council", "sector": "Council", "title": "Lead Low-Code Developer", "date": "2026-02-09", "match": "Exact .NET ecosystem", "tech": "Power Platform; Jadu; .NET; Umbraco; C#; Dynamics"}, {"org": "West Northamptonshire Council", "sector": "Council", "title": "Developer \u2013 Power Platform", "date": "2026-05-24", "match": "Related", "tech": "Power Platform; JavaScript; C#; APIs"}, {"org": "Portsmouth City Council", "sector": "Council", "title": "Low-Code Analyst Developer", "date": "2026-08-18", "match": "Related", "tech": "Power Platform; Microsoft stack"}, {"org": "Tameside Metropolitan Borough Council", "sector": "Council", "title": "Senior Web Developer", "date": "2026-09", "match": "Exact .NET", "tech": "ASP.NET; C#; React; Next.js; MongoDB; GitHub; AI tooling"}, {"org": "University of Glasgow", "sector": "University", "title": "Analyst Developer", "date": "2025-09-30", "match": "Exact .NET", "tech": "C#; ASP.NET; SQL Server; ASP.NET MVC; Azure"}, {"org": "University of Essex", "sector": "University", "title": "Senior Software Engineer, UK Data Archive", "date": "2026-07-20", "match": "Exact .NET", "tech": "C#; .NET Core; AWS; Terraform/CDK; CI/CD"}, {"org": "University of Leeds", "sector": "University", "title": "Senior Integrations Engineer", "date": "2026-06-30", "match": "Exact .NET", "tech": ".NET Core; C#; SQL Server; Azure Functions; Web APIs; MVC"}, {"org": "Queen's University Belfast", "sector": "University", "title": "Project Lead for NICPLD Digital Infrastructure", "date": "2026-07-13", "match": "Exact .NET", "tech": "C#.NET; Java; PHP; React/Vue/Angular"}], "coverage": [{"scope": "England local authorities", "target": "317", "source": "GOV.UK", "note": "317 principal local authorities listed by GOV.UK structure"}, {"scope": "UK higher-education providers", "target": "312", "source": "HESA 2024/25 finance coverage", "note": "HESA reported 312 providers in 2024/25 finance release; 299 had data in that release"}, {"scope": "UK HE provider register", "target": "All current HESA providers", "source": "HESA", "note": "Use HESA current-provider register as the canonical provider universe"}, {"scope": "Scotland/Wales/Northern Ireland councils", "target": "Full national registers", "source": "National/local government registers", "note": "To be added to the organisation coverage table and daily search queue"}]};let tab='active';const $=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function filtered(a){let n=$('q').value.toLowerCase();let r=a.filter(x=>(!n||Object.values(x).join(' ').toLowerCase().includes(n))&&(!$('sector').value||x.sector===$('sector').value)&&(!$('match').value||x.match===$('match').value));r.sort((a,b)=>$('sort').value==='org'?a.org.localeCompare(b.org):(b.posted||b.date||'').localeCompare(a.posted||a.date||''));return r}function card(x){return `<article class="job"><h3>${esc(x.title)}</h3><div class="org">${esc(x.org)}</div><div class="meta"><span class="pill">${esc(x.sector)}</span><span class="pill">${esc(x.location||'UK')}</span>${x.salary?`<span class="pill">${esc(x.salary)}</span>`:''}<span class="pill ${String(x.match).startsWith('Exact')?'exact':'related'}">${esc(x.match)}</span></div><div class="tech">${esc(x.tech)}</div><div class="muted">${x.posted?'Posted: '+esc(x.posted):''}${x.closing?' • Closing: '+esc(x.closing):''}</div><div class="confidence">${esc(x.confidence||'')}</div>${x.url?`<a class="apply" href="${esc(x.url)}" target="_blank" rel="noopener">Open vacancy ↗</a>`:''}</article>`}function render(){let all=[...D.active,...D.leads],exact=[...all,...D.history].filter(x=>String(x.match).startsWith('Exact')).length,orgs=new Set(D.history.map(x=>x.org)).size;$('resultSummary').textContent=tab==='coverage'||tab==='activity'?'':`${filtered(tab==='active'?D.active:tab==='leads'?D.leads:D.history).length} result(s)`;$('kpis').innerHTML=`<div class="kpi"><div class="muted">Active</div><div class="num">${D.active.length}</div></div><div class="kpi"><div class="muted">Research leads</div><div class="num">${D.leads.length}</div></div><div class="kpi"><div class="muted">Exact .NET evidence</div><div class="num">${exact}</div></div><div class="kpi"><div class="muted">Hiring organisations</div><div class="num">${orgs}</div></div>`;if(tab==='coverage'){$('content').innerHTML=D.coverage.map((x,i)=>`<div class="coverage coverage-row"><b>${esc(x.scope)}</b><div>${esc(x.target)}</div><div class="muted">${esc(x.source)} — ${esc(x.note)}</div><div class="bar"><span style="width:${i<2?'100':'35'}%"></span></div></div>`).join('');return}if(tab==='activity'){let z={};D.history.forEach(x=>z[x.org]=(z[x.org]||0)+1);$('content').innerHTML=Object.entries(z).sort((a,b)=>b[1]-a[1]).map(([o,n])=>`<div class="coverage coverage-row"><b>${esc(o)}</b><span class="muted">${n} evidence items</span><div class="bar"><span style="width:${Math.min(100,n*25)}%"></span></div></div>`).join('');return}let a=filtered(tab==='active'?D.active:tab==='leads'?D.leads:D.history);$('content').innerHTML='<div class="list">'+a.map(card).join('')+'</div>'}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()}));
['q','sector','match','sort'].forEach(id=>$(id).addEventListener('input',render));
$('clearBtn').addEventListener('click',()=>{$('q').value='';$('sector').value='';$('match').value='';$('sort').value='date';render()});

async function loadLatest(){
  const status=$('updateStatus');
  try{
    const r=await fetch('jobs.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('jobs.json unavailable');
    D=await r.json();
    const stamp=D.updated_at ? new Date(D.updated_at) : null;
    status.textContent='Latest data: '+(stamp && !isNaN(stamp) ? stamp.toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}) : 'available');
    render();
  }catch(e){
    status.textContent='Using built-in data • latest automatic update unavailable';
    render();
  }
}
$('refreshData').addEventListener('click',loadLatest);
loadLatest();
</script></body></html>
