*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}

.kpi{background:white;border:1px solid #dbe2ea;border-radius:13px;padding:11px}
.num{font-size:22px;font-weight:800}
.muted{font-size:11px;color:#64748b}

.search-form{

}

button{
cursor:pointer
}

.clear-btn{

font-size:13px;

}

.tabs{

gap:6px;

}

.tabs button{

padding:9px 12px;

}

.tabs button.active{

}

.list{

}

.job,.coverage{

padding:13px
}

.job h3{

font-size:16px
}

.org{font-weight:700}
